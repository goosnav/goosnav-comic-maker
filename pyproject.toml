[project]
name = "goosnav-comic-maker"
version = "0.1.0"
description = "A local comic production desk: pencil scans to crisp carousel exports."
requires-python = ">=3.12,<3.14"
dependencies = ["pillow>=11,<13", "numpy>=2,<3", "opencv-python-headless>=4.12,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["app/src"]
testpaths = ["tests"]
